<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luth's Art</title>

<!-- Font Barlow sesuai permintaan -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── 1. VARIABEL & PALET WARNA ── */
:root {
  --magenta: #8a2889;
  --purple: #8c52ff;
  --bg-light: #FDFDFD;
  --text-dark: #1A1A1A;
  --border-grid: rgba(138, 40, 137, 0.05);
  --spring: cubic-bezier(0.25, 1, 0.5, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { 
  font-family: 'Barlow', sans-serif; 
  background-color: var(--bg-light); 
  color: var(--text-dark);
  overflow-x: hidden;
}

/* Latar Belakang Grid */
.grid-bg {
  background-size: 60px 60px;
  background-image: 
    linear-gradient(to right, var(--border-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border-grid) 1px, transparent 1px);
}

/* ── 2. MORPHING FLYING BUTTON (NAVIGASI) ── */
#nav-container {
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
  z-index: 9999; transition: all 0.6s var(--spring);
}
.nav-pill {
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
  border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  border-radius: 50px; display: flex; align-items: center; justify-content: center;
  padding: 8px 12px; width: 340px; height: 60px; overflow: hidden;
  transition: all 0.6s var(--spring);
}
.nav-links {
  display: flex; gap: 8px; width: 100%; justify-content: center; transition: opacity 0.3s;
}
.nav-links a {
  text-decoration: none; color: #555; font-weight: 800; font-size: 15px;
  text-transform: uppercase; padding: 10px 20px; border-radius: 50px; transition: all 0.2s;
  cursor: pointer; white-space: nowrap;
}
.nav-links a:hover, .nav-links a.active { background: rgba(140, 82, 255, 0.1); color: var(--purple); }

/* Hamburger (Hidden by default) */
.nav-hamburger {
  display: none; width: 24px; height: 20px; flex-direction: column; justify-content: space-between;
  cursor: pointer; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
}
.nav-hamburger span {
  display: block; width: 100%; height: 3px; background: var(--magenta); border-radius: 2px;
  transition: all 0.3s ease;
}

/* SCROLLED STATE (Pindah ke Kanan Atas & Jadi Hamburger) */
#nav-container.scrolled {
  top: 20px; left: calc(100% - 30px); transform: translateX(-100%);
}
#nav-container.scrolled .nav-pill {
  width: 60px; padding: 0; border-radius: 50%; cursor: pointer;
}
#nav-container.scrolled .nav-links { opacity: 0; pointer-events: none; position: absolute; }
#nav-container.scrolled .nav-hamburger { display: flex; }
#nav-container.scrolled .nav-pill:hover { box-shadow: 0 5px 20px rgba(140, 82, 255, 0.3); }

/* MENU OPEN STATE (Vertikal Dropdown saat Hamburger di-klik) */
#nav-container.scrolled.menu-open .nav-pill {
  width: 160px; height: auto; border-radius: 20px; padding: 20px 10px;
  flex-direction: column; cursor: default;
}
#nav-container.scrolled.menu-open .nav-hamburger {
  position: relative; top: 0; left: 0; transform: none; margin-bottom: 16px; align-self: flex-end; margin-right: 10px;
}
#nav-container.scrolled.menu-open .nav-hamburger span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
#nav-container.scrolled.menu-open .nav-hamburger span:nth-child(2) { opacity: 0; }
#nav-container.scrolled.menu-open .nav-hamburger span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
#nav-container.scrolled.menu-open .nav-links {
  opacity: 1; pointer-events: auto; position: relative; flex-direction: column; align-items: stretch;
}
#nav-container.scrolled.menu-open .nav-links a { text-align: right; padding: 12px 20px; }

/* Mobile Mode Adjustment untuk Morphing Nav */
@media(max-width: 768px) {
  #nav-container { top: 20px; width: 90%; }
  .nav-pill { width: 100%; height: 56px; }
  .nav-links a { font-size: 13px; padding: 10px 12px; }
  #nav-container.scrolled { left: calc(100% - 20px); width: auto; }
}

/* ── 3. HERO SECTION (SANDWICH & PRESISI TYPOGRAPHY) ── */
header {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; padding: 100px 40px 0; max-width: 1400px; margin: 0 auto;
}
.hero-wrapper {
  display: flex; align-items: center; justify-content: space-between; width: 100%; position: relative;
}

/* KIRI: Layer Sandwich (File lokal LUTH 1.png dan Profile.png) */
.hero-visual {
  position: relative; width: 600px; height: 600px; flex-shrink: 0;
}
.logo-back {
  position: absolute; inset: 0; background-image: url('LUTH 1.png');
  background-position: center; background-size: contain; background-repeat: no-repeat;
  clip-path: inset(0 0 50% 0); z-index: 1;
}
.logo-front {
  position: absolute; inset: 0; background-image: url('LUTH 1.png');
  background-position: center; background-size: contain; background-repeat: no-repeat;
  clip-path: inset(50% 0 0 0); z-index: 3; mix-blend-mode: multiply; opacity: 0.9;
}
.hero-model {
  position: absolute; bottom: -5%; left: 50%; transform: translateX(-50%);
  height: 110%; object-fit: contain; z-index: 2;
  /* Jika Profile.png tidak ada di lokal, otomatis fallback ke Github */
}

/* TENGAH: Presisi Teks & Tombol Kotak Tajam */
.hero-text { flex-grow: 1; padding-left: 40px; z-index: 4; }
.hero-text h1 {
  font-size: clamp(3rem, 4.5vw, 4.2rem); font-weight: 500; line-height: 1.2;
  color: var(--text-dark); letter-spacing: -0.5px;
}
.c-mag { color: var(--magenta); font-weight: 900; }
.c-purp { color: var(--purple); font-weight: 900; }

.hero-actions { display: flex; gap: 16px; margin-top: 40px; }
.btn {
  padding: 18px 36px; font-size: 16px; font-weight: 900; font-family: 'Barlow', sans-serif;
  text-transform: uppercase; text-decoration: none; border: none; cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease; border-radius: 0; 
}
.btn-purp { background: var(--purple); color: #fff; }
.btn-purp:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(140, 82, 255, 0.3); }
.btn-mag { background: var(--magenta); color: #fff; }
.btn-mag:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(138, 40, 137, 0.3); }

/* KANAN: Pattern Logo Grid (Membentuk puzzle abstrak sesuai Sample Page 1) */
.side-pattern {
  position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
  display: grid; grid-template-columns: repeat(2, 60px); grid-template-rows: repeat(4, 60px); gap: 8px;
  z-index: 0; opacity: 0.9;
}
.pattern-block {
  width: 100%; height: 100%; background-image: url('LUTH 1.png');
  background-size: 200% 200%; background-repeat: no-repeat;
}
.pb-u { background-position: 100% 0; }
.pb-l { background-position: 0 0; }
.pb-h { background-position: 100% 100%;}
.pb-t { background-position: 0 100%; }

/* Responsive Hero */
@media(max-width: 1100px) {
  header { padding-top: 140px; }
  .hero-wrapper { flex-direction: column; text-align: center; }
  .hero-text { padding-left: 0; margin-top: 30px; }
  .hero-actions { justify-content: center; }
  .side-pattern { display: none; }
  .hero-visual { width: 450px; height: 450px; }
}

/* ── 4. KATEGORI & ACCORDION GALLERY (FIT CONTENT RATIO) ── */
section { padding: 60px 24px 100px; max-width: 1300px; margin: 0 auto; }

.category-menu {
  display: flex; justify-content: center; gap: 12px; margin-bottom: 50px; flex-wrap: wrap;
}
.cat-btn {
  padding: 10px 28px; font-family: 'Barlow', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 14px;
  background: transparent; border: 2px solid rgba(0,0,0,0.1); border-radius: 50px;
  color: #555; cursor: pointer; transition: all 0.2s;
}
.cat-btn.active, .cat-btn:hover { border-color: var(--purple); color: var(--purple); background: rgba(140, 82, 255, 0.05); }

.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 60px 40px;
}
.project-card { display: flex; flex-direction: column; gap: 16px; cursor: pointer; }

/* Wrapper Gallery Dinamis */
.stack-wrapper {
  position: relative; width: 100%; height: 380px; display: flex; align-items: center; justify-content: center;
  border-radius: 16px; background: transparent; transition: all 0.4s var(--spring); overflow: visible;
}

/* Kondisi Awal: Bertumpuk (Collapsed) */
.stack-slice {
  position: absolute; height: 100%; width: 100%;
  border-radius: 16px; overflow: hidden; transition: all 0.5s var(--spring);
  box-shadow: -4px 0 15px rgba(0,0,0,0.1); border: 2px solid #FFF; background: var(--bg-light);
}
.stack-slice img { width: 100%; height: 100%; object-fit: cover; transition: all 0.4s ease; }
.stack-slice:nth-child(1) { z-index: 4; transform: scale(1) translateX(0); }
.stack-slice:nth-child(2) { z-index: 3; transform: scale(0.95) translateX(20px); opacity: 0.9; }
.stack-slice:nth-child(3) { z-index: 2; transform: scale(0.9) translateX(40px); opacity: 0.7; }

/* Kondisi Di-Hover/Di-Scroll (Mobile): Expand & Fit Ratio Asli */
.project-card:hover .stack-wrapper {
  justify-content: flex-start; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px;
}
.project-card:hover .stack-slice {
  position: relative; flex: 0 0 80px; /* Bentuk kapsul awal */
  transform: none; opacity: 1; border-radius: 40px; scroll-snap-align: center;
}
.project-card:hover .stack-slice:hover {
  flex: 1 0 auto; /* Membesar dinamis sesuai lebar konten asli */
  border-radius: 16px;
}
.project-card:hover .stack-slice:hover img { 
  width: auto; /* Kunci rahasia agar fit-to-ratio asli tanpa gepeng */
  max-width: 100%; object-fit: contain; background: #eee;
}

.project-info h3 { font-size: 24px; font-weight: 900; color: var(--text-dark); margin-bottom: 6px; letter-spacing: -0.5px;}
.project-badge {
  display: inline-block; padding: 6px 14px; background: rgba(140, 82, 255, 0.1);
  color: var(--purple); font-weight: 800; font-size: 12px; text-transform: uppercase; border-radius: 6px;
}

/* ── 5. LIGHTBOX ── */
#modal { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(10, 10, 10, 0.95); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
#modal-content { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#modal-media-container { display: flex; width: 100%; height: 85vh; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
#modal-media-container::-webkit-scrollbar { display: none; }
#modal-media-container img { flex: 0 0 100%; scroll-snap-align: center; width: 100%; height: 100%; object-fit: contain; padding: 0 60px; }
.modal-close { position: absolute; top: 20px; right: 30px; background: transparent; color: #FFF; border: none; font-size: 40px; cursor: pointer; z-index: 1000; }
.modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: #FFF; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: background 0.2s; z-index: 1000; }
.modal-nav:hover { background: var(--purple); }
.nav-prev { left: 20px; } .nav-next { right: 20px; }
.modal-info-bar { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); text-align: center; color: #FFF; }

/* ── 6. FOOTER 5 ICON ── */
footer { padding: 80px 0 60px; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); }
.footer-card { max-width: 900px; margin: 0 auto; text-align: center; }
.footer-motto { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; color: var(--magenta); margin-bottom: 32px; letter-spacing: -1px; }
.social-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
.social-btn {
  width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: var(--text-dark); border: 1px solid rgba(0,0,0,0.06); background: #FFFFFF; transition: all 0.2s;
}
.social-btn:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: translateY(-4px); }
.footer-copy { font-family: 'Barlow', monospace; font-size: 13px; font-weight: 700; color: #999; text-transform: uppercase; }

</style>

<script>
// ── LOGIKA NAVIGASI MORPHING & TOGGLE MENU ──
const navContainer = document.getElementById('nav-container');
window.addEventListener('scroll', () => {
  if (window.scrollY > 80) {
    navContainer.classList.add('scrolled');
  } else {
    // Reset kembali ke Pill saat di atas
    navContainer.classList.remove('scrolled');
    navContainer.classList.remove('menu-open');
  }
});
function toggleMenu() {
  if (navContainer.classList.contains('scrolled')) {
    navContainer.classList.toggle('menu-open');
  }
}

// ── LOGIKA FETCH DATA & KATEGORI ──
const DATA_URL = 'https://raw.githubusercontent.com/luthfihd/luthporto/main/data.json';
const IMAGES_BASE = 'https://raw.githubusercontent.com/luthfihd/luthporto/main/images/';
let portfolioData = [];
let categories = ['Overview']; // Default

function getDriveUrl(url, size) {
  let fileId = null;
  if (url.includes('/file/d/')) fileId = url.split('/file/d/')[1]?.split('/')[0];
  else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
  if (fileId) {
    return `https://images.weserv.nl/?url=${encodeURIComponent(`https://drive.google.com/thumbnail?authuser=0&sz=w${size}&id=${fileId}`)}&output=webp`;
  }
  return url;
}

async function loadPortfolio() {
  try {
    const res = await fetch(DATA_URL);
    portfolioData = await res.json();
    
    // Mengekstrak Kategori Unik dari Base Code
    portfolioData.forEach(item => {
      if (item.category && !categories.includes(item.category)) {
        categories.push(item.category);
      }
    });
    
    // Render Tombol Kategori
    const catMenu = document.getElementById('categoryMenu');
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = cat === 'Overview' ? 'cat-btn active' : 'cat-btn';
      btn.textContent = cat;
      btn.onclick = (e) => filterGallery(cat, e);
      catMenu.appendChild(btn);
    });

    filterGallery('Overview');
  } catch(e) {
    document.getElementById('galleryGrid').innerHTML = '<p>Gagal memuat data.</p>';
  }
}

function filterGallery(category, event) {
  if (event) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }
  
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  
  // Overview memuat max 12 data (First Showing), kategori lain sesuai filter
  let filteredData = category === 'Overview' ? portfolioData.slice(0, 12) : portfolioData.filter(p => p.category === category);

  filteredData.forEach(item => {
    const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
    const totalFiles = rawLinks.length;
    
    const card = document.createElement('div');
    card.className = 'project-card';

    let slicesHtml = '';
    rawLinks.slice(0, 4).forEach((link, idx) => {
      let src = link.trim().replace('#video', '');
      src = src.startsWith('http') ? src : IMAGES_BASE + src;
      if (src.includes('drive.google.com')) src = getDriveUrl(src, 600);
      slicesHtml += `<div class="stack-slice" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')}, ${idx})"><img src="${src}" loading="lazy"></div>`;
    });
    
    card.innerHTML = `
      <div class="stack-wrapper">${slicesHtml}</div>
      <div class="project-info">
        <h3>${item.title}</h3><span class="project-badge">${totalFiles} Items - ${item.category}</span>
      </div>`;
    grid.appendChild(card);
  });
}

// ── LOGIKA LIGHTBOX ──
function moveGallery(direction) {
  const container = document.getElementById('modal-media-container');
  container.scrollBy({ left: direction * container.offsetWidth, behavior: 'smooth' });
}

function openLightbox(item, targetIndex) {
  const modal = document.getElementById('modal');
  const container = document.getElementById('modal-media-container');
  container.innerHTML = '';
  modal.style.display = 'flex';
  setTimeout(() => modal.style.opacity = '1', 10);

  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-desc').textContent = item.desc || item.category;

  const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
  
  rawLinks.forEach((link, idx) => {
    let src = link.trim().replace('#video', '');
    src = src.startsWith('http') ? src : IMAGES_BASE + src;
    if (src.includes('drive.google.com')) src = getDriveUrl(src, 1600);
    container.innerHTML += `<img id="img-slice-${idx}" src="${src}" alt="Art">`;
  });

  document.getElementById('btn-prev').style.display = rawLinks.length > 1 ? 'block' : 'none';
  document.getElementById('btn-next').style.display = rawLinks.length > 1 ? 'block' : 'none';
  document.body.style.overflow = 'hidden';

  setTimeout(() => {
      const targetImg = document.getElementById(`img-slice-${targetIndex}`);
      if(targetImg) targetImg.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'center' });
  }, 50);
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.style.opacity = '0';
  setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = ''; }, 300);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

loadPortfolio();
</script>
