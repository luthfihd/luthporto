<!DOCTYPE html> 
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luth's Art</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

<style>
/* ── 1. VARIABEL & PALET WARNA ── */
:root {
  --magenta: #8a2889;
  --purple: #8c52ff;
  --bg-light: #FDFDFD;
  --text-dark: #1A1A1A;
  --border-grid: rgba(138, 40, 137, 0.08); 
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1); 
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { 
  font-family: 'Barlow', sans-serif; 
  background-color: var(--bg-light); 
  color: var(--text-dark);
  overflow-x: hidden;
}

/* Latar Belakang Grid Arsitektur */
.grid-bg {
  background-size: 50px 50px;
  background-image: 
    linear-gradient(to right, var(--border-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border-grid) 1px, transparent 1px);
}

/* ── 2. FLOATING ACTION BUTTONS ── */
#fab-container {
  position: fixed; top: 30px; right: 30px; z-index: 9999;
  display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
  opacity: 0; pointer-events: none; transform: translateY(-20px);
  transition: all 0.4s ease;
}
#fab-container.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
#fab-container.idle-mobile { opacity: 0.3; }
#fab-container.idle-mobile:hover, #fab-container.idle-mobile:active { opacity: 1; }

.fab-home {
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.05);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform 0.2s; text-decoration: none; overflow: hidden;
}
.fab-home:hover { transform: scale(1.05); }
.fab-home img { width: 70%; height: 70%; object-fit: contain; }

/* Liquid Kapsul "HIT ME UP!" -> "CLOSE" */
.liquid-pill {
  background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(0,0,0,0.06);
  border-radius: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; transition: all 0.6s var(--spring);
  height: 50px; width: 140px; cursor: pointer;
}
.liquid-pill.active {
  height: 380px; width: 50px; 
  background: var(--magenta); border-color: var(--magenta);
}

.lp-socials {
  display: flex; flex-direction: column; gap: 12px; align-items: center;
  opacity: 0; transition: all 0.4s ease;
  height: 0; pointer-events: none;
}
.liquid-pill.active .lp-socials {
  opacity: 1; height: auto; padding: 20px 0 10px; pointer-events: auto;
}

.soc-mini {
  width: 34px; height: 34px; border-radius: 50%; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: #fff; transition: all 0.2s; text-decoration: none; border: 1px solid rgba(255,255,255,0.3);
}
.soc-mini:hover { background: #fff; color: var(--magenta); border-color: #fff; transform: scale(1.1); }

.lp-text {
  font-weight: 900; font-size: 13px; letter-spacing: 0.5px;
  color: var(--magenta); text-transform: uppercase; transition: all 0.3s;
  white-space: nowrap;
}
.liquid-pill.active .lp-text { 
  writing-mode: vertical-rl; transform: rotate(180deg);
  color: #fff; font-size: 14px; letter-spacing: 2px; padding: 15px 0;
}

@media(max-width: 768px) {
  #fab-container { top: auto; bottom: 30px; right: 20px; flex-direction: column-reverse; }
  .liquid-pill { flex-direction: column-reverse; } 
  .liquid-pill.active .lp-socials { padding: 10px 0 20px; }
  .liquid-pill.active .lp-text { transform: rotate(0deg); }
}

/* ── 3. HERO SECTION ── */
header {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; max-width: 1400px; margin: 0 auto; padding: 0 24px;
}
.hero-wrapper { display: flex; align-items: center; justify-content: space-between; width: 100%; }

.hero-visual { position: relative; width: 680px; height: 680px; flex-shrink: 0; }
.logo-back { position: absolute; inset: 0; background-image: url('LUTH 1.png'); background-position: center; background-size: contain; background-repeat: no-repeat; clip-path: inset(0 0 50% 0); z-index: 1; }
.logo-front { position: absolute; inset: 0; background-image: url('LUTH 1.png'); background-position: center; background-size: contain; background-repeat: no-repeat; clip-path: inset(50% 0 0 0); z-index: 3; mix-blend-mode: multiply; opacity: 0.9; }
.hero-model { position: absolute; bottom: -8%; left: 50%; transform: translateX(-50%); height: 115%; object-fit: contain; z-index: 2; }

.hero-text { flex-grow: 1; padding-left: 60px; z-index: 4; }
.hero-text h1 { font-size: clamp(3.5rem, 5.5vw, 5rem); font-weight: 500; line-height: 1.15; color: var(--text-dark); letter-spacing: -1px; }
.c-mag { color: var(--magenta); font-weight: 900; }
.c-purp { color: var(--purple); font-weight: 900; }

.hero-actions { display: flex; gap: 16px; margin-top: 40px; }
.btn { padding: 18px 36px; font-size: 16px; font-weight: 900; font-family: 'Barlow', sans-serif; text-transform: uppercase; text-decoration: none; border: none; cursor: pointer; transition: transform 0.2s ease; background: var(--purple); color: #fff; }
.btn:hover { transform: translateY(-3px); }

@media(max-width: 1024px) {
  .hero-wrapper { flex-direction: column; text-align: center; }
  .hero-text { padding-left: 0; margin-top: 40px; }
  .hero-actions { justify-content: center; }
  .hero-visual { width: 450px; height: 450px; }
}

/* ── 4. CATEGORY, MASONRY & ABSTRACT GRID ── */
section { padding: 80px 0 100px; max-width: 1400px; margin: 0 auto; }
.category-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 50px; flex-wrap: wrap; padding: 0 24px; }
.cat-btn { padding: 10px 28px; font-family: 'Barlow', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 13px; background: transparent; border: 2px solid rgba(0,0,0,0.1); border-radius: 50px; color: #555; cursor: pointer; transition: all 0.2s; }
.cat-btn.active, .cat-btn:hover { border-color: var(--purple); color: var(--purple); background: rgba(140, 82, 255, 0.05); }

/* MASONRY STANDARD (Untuk kategori selain Overview) */
.masonry-grid { padding: 0 24px; column-count: 3; column-gap: 20px; width: 100%; }
.masonry-item { break-inside: avoid; margin-bottom: 20px; position: relative; border-radius: 12px; overflow: hidden; background: #eee; cursor: pointer; }
@media (max-width: 900px) { .masonry-grid { column-count: 2; } }
@media (max-width: 600px) { .masonry-grid { column-count: 1; } }

/* ABSTRACT GRID EKSKLUSIF (Hanya untuk Overview - 0px Gap) */
.abstract-grid {
  display: grid; padding: 0;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 250px; gap: 0px; width: 100%;
}
.abstract-grid .masonry-item { margin-bottom: 0; border-radius: 0; border: 1px solid rgba(0,0,0,0.05); }
/* Memaksa rasio cover agar pas di grid abstrak */
.abstract-grid .masonry-item img { height: 100%; object-fit: cover; }
/* Formasi Abstrak 9 Item */
.abstract-grid .masonry-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
.abstract-grid .masonry-item:nth-child(2) { grid-column: span 1; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(3) { grid-column: span 1; grid-row: span 2; }
.abstract-grid .masonry-item:nth-child(4) { grid-column: span 1; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(5) { grid-column: span 2; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(6) { grid-column: span 1; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(7) { grid-column: span 1; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(8) { grid-column: span 2; grid-row: span 1; }
.abstract-grid .masonry-item:nth-child(9) { grid-column: span 2; grid-row: span 1; }

@media (max-width: 768px) {
  .abstract-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  .abstract-grid .masonry-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .abstract-grid .masonry-item:nth-child(3) { grid-column: span 1; grid-row: span 1; }
  .abstract-grid .masonry-item:nth-child(5) { grid-column: span 2; grid-row: span 1; }
  .abstract-grid .masonry-item:nth-child(8), .abstract-grid .masonry-item:nth-child(9) { grid-column: span 2; }
}

/* THUMBNAIL MULTI-GAMBAR (Scroll Murni tanpa Accordion) */
.item-scroll-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; width: 100%; height: 100%; }
.item-scroll-container::-webkit-scrollbar { display: none; }
.scroll-img { flex: 0 0 100%; scroll-snap-align: center; width: 100%; height: auto; object-fit: cover; display: block; }
.single-img { width: 100%; height: auto; object-fit: cover; display: block; }

/* Overlay Thumbnail */
.item-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.85)); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
.masonry-item:hover .item-overlay { opacity: 1; pointer-events: auto; }
.item-overlay h3 { color: #fff; font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.item-overlay p { color: #ddd; font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge-count { position: absolute; top: 12px; right: 12px; background: rgba(140,82,255,0.9); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 50px; z-index: 2; }

/* ── 5. LIGHTBOX KEMBALI KE ASAL (KONTAINER MENGIKUTI RASIO) ── */
#modal {
  display: none; position: fixed; inset: 0; z-index: 99999;
  background: rgba(15, 15, 15, 0.98); align-items: center; justify-content: center; 
  opacity: 0; transition: opacity 0.3s; padding: 40px 20px;
}
/* Tombol Close di Layar Absolute */
.modal-close-btn {
  position: fixed; top: 20px; right: 30px; background: transparent; color: #FFF; 
  border: none; font-size: 40px; cursor: pointer; z-index: 100000;
}

/* Modal Content Inline-Block (Shrink-Wrap otomatis!) */
#modal-content {
  display: inline-block; /* Kunci agar ngikut lebar image */
  background: #fff; border-radius: 8px; overflow: hidden;
  max-width: 90vw; max-height: 90vh; position: relative;
  text-align: center;
}

#lightbox-main-img {
  max-height: 70vh; max-width: 100%; 
  width: auto; height: auto; display: block; margin: 0 auto;
}

.modal-info-box {
  background: #fff; padding: 20px 30px; text-align: left; width: 100%;
}
.modal-info-box h3 { font-size: 28px; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; line-height: 1.1; }
.desc-text {
  font-size: 16px; color: #444; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  transition: all 0.3s;
}
.desc-text.expanded { -webkit-line-clamp: unset; }
.see-more-btn { background: none; border: none; color: var(--purple); font-weight: 800; font-family: 'Barlow', sans-serif; cursor: pointer; padding: 8px 0 0 0; text-decoration: underline; font-size: 14px; display: none; }

.modal-nav { position: absolute; top: 40%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #FFF; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: background 0.2s; z-index: 1000; }
.modal-nav:hover { background: var(--purple); }
.nav-prev { left: 15px; } .nav-next { right: 15px; }

/* ── 6. FOOTER ── */
footer { padding: 40px 0; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); text-align: center; }
.footer-copy { font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; font-style: italic; color: #666; }
</style>
</head>

<script>
// ── DATA & FAB LOGIC ──
const OVERVIEW_LIMIT = 9; 
const DATA_URL = 'https://raw.githubusercontent.com/luthfihd/luthporto/main/data.json';
const IMAGES_BASE = 'https://raw.githubusercontent.com/luthfihd/luthporto/main/images/';

const fabContainer = document.getElementById('fab-container');
const liquidPill = document.getElementById('liquidPill');
const lpText = document.getElementById('lpText');
let idleTimer;

window.addEventListener('scroll', () => {
  if (window.scrollY > window.innerHeight * 0.5) { fabContainer.classList.add('visible'); }
  else { fabContainer.classList.remove('visible'); liquidPill.classList.remove('active'); lpText.textContent = 'HIT ME UP!'; }

  if (window.innerWidth <= 768) {
    fabContainer.classList.remove('idle-mobile');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if(fabContainer.classList.contains('visible') && !liquidPill.classList.contains('active')) fabContainer.classList.add('idle-mobile'); }, 2000);
  }
});

function toggleContact() {
  liquidPill.classList.toggle('active');
  if(liquidPill.classList.contains('active')) { lpText.textContent = 'CLOSE'; fabContainer.classList.remove('idle-mobile'); } 
  else { lpText.textContent = 'HIT ME UP!'; }
}

// ── PORTFOLIO LOGIC ──
let portfolioData = [];
let categories = ['Overview'];

function getDriveUrl(url, size) {
  let fileId = null;
  if (url.includes('/file/d/')) fileId = url.split('/file/d/')[1]?.split('/')[0];
  else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
  if (fileId) return `https://images.weserv.nl/?url=${encodeURIComponent(`https://drive.google.com/thumbnail?authuser=0&sz=w${size}&id=${fileId}`)}&output=webp`;
  return url;
}

async function loadPortfolio() {
  try {
    const res = await fetch(DATA_URL);
    portfolioData = await res.json();
    
    portfolioData.forEach(item => {
      if (item.category && !categories.includes(item.category)) categories.push(item.category);
    });
    
    const catMenu = document.getElementById('categoryMenu');
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = cat === 'Overview' ? 'cat-btn active' : 'cat-btn';
      btn.textContent = cat;
      btn.onclick = (e) => filterGallery(cat, e);
      catMenu.appendChild(btn);
    });

    filterGallery('Overview');
  } catch(e) {
    document.getElementById('galleryGrid').innerHTML = '<p>Gagal memuat data.</p>';
  }
}

function filterGallery(category, event) {
  if (event) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }
  
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  
  let filteredData = [];
  if (category === 'Overview') {
    // Mode Abstrak, Shuffle Random & Ambil 9
    grid.className = 'abstract-grid';
    filteredData = [...portfolioData].sort(() => 0.5 - Math.random()).slice(0, OVERVIEW_LIMIT);
  } else {
    // Mode Masonry Biasa
    grid.className = 'masonry-grid';
    filteredData = portfolioData.filter(p => p.category === category);
  }

  filteredData.forEach((item, index) => {
    const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
    const totalFiles = rawLinks.length;
    
    const card = document.createElement('div');
    card.className = 'masonry-item';

    let mediaHtml = '';
    if (totalFiles > 1) {
      mediaHtml += `<div class="item-scroll-container">`;
      rawLinks.forEach((link, idx) => {
        let src = link.trim().replace('#video', '');
        src = src.startsWith('http') ? src : IMAGES_BASE + src;
        if (src.includes('drive.google.com')) src = getDriveUrl(src, 600);
        mediaHtml += `<img src="${src}" class="scroll-img" loading="lazy" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')})">`;
      });
      mediaHtml += `</div><div class="badge-count">${totalFiles} FILES</div>`;
    } else {
      let src = rawLinks[0].trim().replace('#video', '');
      src = src.startsWith('http') ? src : IMAGES_BASE + src;
      if (src.includes('drive.google.com')) src = getDriveUrl(src, 600);
      mediaHtml = `<img src="${src}" class="single-img" loading="lazy" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')})">`;
    }
    
    card.innerHTML = `
      ${mediaHtml}
      <div class="item-overlay" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')})">
        <h3>${item.title}</h3>
        <p>${item.desc || item.category}</p>
      </div>`;
    grid.appendChild(card);
  });
}

// ── LIGHTBOX LOGIC ──
let currentLightboxImages = [];
let currentLightboxIndex = 0;

function openLightbox(item) {
  const modal = document.getElementById('modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.style.opacity = '1', 10);

  document.getElementById('modal-title').textContent = item.title;
  const descEl = document.getElementById('modal-desc');
  descEl.textContent = item.desc || item.category;
  descEl.classList.remove('expanded');
  
  const seeMoreBtn = document.getElementById('seeMoreBtn');
  seeMoreBtn.style.display = 'none'; 
  seeMoreBtn.textContent = 'Read more';

  // Kumpulkan array URL
  const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
  currentLightboxImages = rawLinks.map(link => {
    let src = link.trim().replace('#video', '');
    src = src.startsWith('http') ? src : IMAGES_BASE + src;
    if (src.includes('drive.google.com')) src = getDriveUrl(src, 1600);
    return src;
  });

  currentLightboxIndex = 0;
  updateModalImg();

  document.getElementById('btn-prev').style.display = currentLightboxImages.length > 1 ? 'block' : 'none';
  document.getElementById('btn-next').style.display = currentLightboxImages.length > 1 ? 'block' : 'none';
  document.body.style.overflow = 'hidden';

  setTimeout(() => {
      if (descEl.scrollHeight > descEl.clientHeight) {
          seeMoreBtn.style.display = 'inline-block';
      }
  }, 50);
}

function changeModalImg(dir) {
  currentLightboxIndex += dir;
  if(currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
  if(currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;
  updateModalImg();
}

function updateModalImg() {
  const mainImg = document.getElementById('lightbox-main-img');
  mainImg.src = currentLightboxImages[currentLightboxIndex];
}

function toggleDesc() {
  const descEl = document.getElementById('modal-desc');
  const btn = document.getElementById('seeMoreBtn');
  descEl.classList.toggle('expanded');
  if(descEl.classList.contains('expanded')) btn.textContent = 'Read less';
  else btn.textContent = 'Read more';
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.style.opacity = '0';
  setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = ''; }, 300);
}

document.addEventListener('keydown', e => { 
  if(e.key==='Escape') closeModal(); 
  if(e.key==='ArrowRight') changeModalImg(1);
  if(e.key==='ArrowLeft') changeModalImg(-1);
});

loadPortfolio();
</script>
