<!DOCTYPE html> 
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luth - Creative Content Specialist</title>

<!-- Menggunakan Font Barlow sesuai instruksi -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── PALET WARNA & VARIABEL ── */
:root {
  --magenta: #8a2889;
  --purple: #8c52ff;
  --bg-light: #FDFDFD;
  --text-dark: #1A1A1A;
  --border-grid: rgba(138, 40, 137, 0.05);
  --spring: cubic-bezier(0.25, 1, 0.5, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { 
  font-family: 'Barlow', sans-serif; 
  background-color: var(--bg-light); 
  color: var(--text-dark);
  overflow-x: hidden;
}

/* Latar Belakang Grid Arsitektural */
.grid-bg {
  background-size: 40px 40px;
  background-image: 
    linear-gradient(to right, var(--border-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border-grid) 1px, transparent 1px);
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ── NAVIGASI (PILL TENGAH - NO LOGO KIRI, NO TOMBOL KANAN) ── */
.nav-pill {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 50px;
  display: flex; gap: 4px; padding: 6px;
  z-index: 1000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.04);
}
.nav-pill a {
  text-decoration: none; color: #555;
  font-weight: 700; font-size: 14px; text-transform: uppercase;
  padding: 8px 20px; border-radius: 50px;
  transition: all 0.2s;
}
.nav-pill a:hover, .nav-pill a.active {
  background: rgba(140, 82, 255, 0.1); color: var(--purple);
}

/* ── HERO SECTION (SANDWICH EFFECT DENGAN LUTH 1.png & Profile.png) ── */
header {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; padding-top: 80px;
}
.hero-wrapper {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 1050px; position: relative;
}

/* Kiri: Komposisi Visual Overlapping berbasis Gambar */
.hero-visual {
  position: relative; width: 450px; height: 450px; flex-shrink: 0;
}
/* Memotong "LUTH 1.png" bagian LU untuk ditaruh di belakang */
.logo-back {
  position: absolute; inset: 0;
  background-image: url('LUTH 1.png'); background-position: center; background-size: contain; background-repeat: no-repeat;
  clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
  z-index: 1;
}
/* Memotong "LUTH 1.png" bagian TH untuk ditaruh di depan */
.logo-front {
  position: absolute; inset: 0;
  background-image: url('LUTH 1.png'); background-position: center; background-size: contain; background-repeat: no-repeat;
  clip-path: polygon(0 48%, 100% 48%, 100% 100%, 0 100%);
  z-index: 3; mix-blend-mode: multiply; opacity: 0.85;
}
.hero-model {
  position: absolute; bottom: -5%; left: 50%;
  transform: translateX(-50%); height: 115%; object-fit: contain; z-index: 2;
}

/* Tengah: Typography & Tombol Tajam */
.hero-text { flex-grow: 1; padding-left: 50px; z-index: 4; }
.hero-text h1 { font-size: clamp(2.5rem, 4vw, 3.2rem); font-weight: 400; line-height: 1.4; color: var(--text-dark); }
.hero-text h1 span { font-weight: 900; }
.c-mag { color: var(--magenta); }
.c-purp { color: var(--purple); }

.hero-actions { display: flex; gap: 16px; margin-top: 32px; }
.btn {
  padding: 14px 28px; font-size: 15px; font-weight: 800; font-family: 'Barlow', sans-serif;
  text-transform: uppercase; text-decoration: none; border: none; cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease; border-radius: 0;
}
.btn-purp { background: var(--purple); color: #fff; }
.btn-purp:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(140, 82, 255, 0.3); }
.btn-mag { background: var(--magenta); color: #fff; }
.btn-mag:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(138, 40, 137, 0.3); }

/* Kanan: Pola Vertikal Geometris */
.side-pattern {
  position: absolute; right: -50px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; line-height: 0.8; font-size: 120px; font-weight: 900;
  letter-spacing: -6px; z-index: 0; opacity: 0.8; user-select: none;
}

/* ── OVERVIEW: ACCORDION GALLERY (GOOGLE PHOTOS EXPAND STYLE) ── */
section { padding: 60px 0 100px; }
.section-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 40px; color: var(--text-dark); text-align: center; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
  gap: 50px 30px;
}
.project-card { display: flex; flex-direction: column; gap: 16px; }

/* Flexbox Accordion Container */
.accordion-wrapper {
  display: flex; width: 100%; height: 320px; gap: 8px;
}
.acc-slice {
  flex: 1; position: relative; overflow: hidden;
  border-radius: 20px; border: 2px solid #FFF; cursor: pointer;
  transition: flex 0.5s var(--spring);
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  background: #EEE;
}
.acc-slice img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
}
/* Efek Mengembang/Mekar saat di Hover */
.acc-slice:hover { flex: 4; }
.acc-slice:hover img { transform: scale(1.05); }

/* Jika hanya 1 gambar, biarkan full */
.acc-single { flex: 1; border-radius: 20px; overflow: hidden; height: 320px; border: 2px solid #FFF; box-shadow: 0 4px 15px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s;}
.acc-single:hover { transform: translateY(-4px); }
.acc-single img { width: 100%; height: 100%; object-fit: cover; }

.project-info h3 { font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
.project-badge {
  display: inline-block; padding: 4px 12px; background: rgba(140, 82, 255, 0.1);
  color: var(--purple); font-weight: 700; font-size: 12px; text-transform: uppercase; border-radius: 4px;
}

/* ── LIGHTBOX (FIT-TO-RATIO) ── */
#modal {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(10, 10, 10, 0.95); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
}
#modal-content {
  position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#modal-media-container {
  display: flex; width: 100%; height: 85vh; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
}
#modal-media-container::-webkit-scrollbar { display: none; }
#modal-media-container img {
  flex: 0 0 100%; scroll-snap-align: center; width: 100%; height: 100%;
  object-fit: contain; padding: 0 60px;
}
.modal-close {
  position: absolute; top: 20px; right: 30px; background: transparent; color: #FFF; border: none; font-size: 40px; cursor: pointer; z-index: 1000;
}
.modal-nav {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: #FFF;
  width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: background 0.2s; z-index: 1000;
}
.modal-nav:hover { background: var(--purple); }
.nav-prev { left: 20px; }
.nav-next { right: 20px; }
.modal-info-bar {
  position: absolute; bottom: 0; width: 100%; padding: 20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8)); text-align: center; color: #FFF;
}

/* ── FOOTER BASE CODE ── */
footer { padding: 60px 0 40px; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); }
.footer-card { max-width: 900px; margin: 0 auto; text-align: center; }
.footer-motto { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900; color: var(--magenta); margin-bottom: 32px; }
.social-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
.social-btn {
  width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: var(--text-dark); border: 1px solid rgba(0,0,0,0.06); background: #FFFFFF; transition: all 0.2s;
}
.social-btn:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: translateY(-4px); }
.footer-copy { font-family: 'Space Mono', monospace; font-size: 12px; color: #999; }

/* ── RESPONSIVE ── */
@media(max-width: 900px) {
  .hero-wrapper { flex-direction: column; text-align: center; }
  .hero-text { padding-left: 0; margin-top: 0px; }
  .hero-actions { justify-content: center; }
  .side-pattern { display: none; }
  .hero-visual { width: 350px; height: 350px; }
  .gallery-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="grid-bg">

<!-- NAV PILL TENGAH -->
<nav class="nav-pill">
  <a href="#" class="active">Home</a>
  <a href="#overview">Overview</a>
  <a href="#footer">Contact</a>
</nav>

<!-- HERO SECTION -->
<header id="home">
  <div class="hero-wrapper">
    <div class="hero-visual">
      <!-- 3 Layer efek sandwich (LUTH belakang, Model tengah, LUTH transparan depan) -->
      <div class="logo-back"></div>
      <img src="Profile.png" alt="Luthfi Hidayat" class="hero-model" onerror="this.src='https://via.placeholder.com/350x450/ccc/transparent?text=Profile.png'">
      <div class="logo-front"></div>
    </div>
    
    <div class="hero-text">
      <h1>Hi! I'm Luthfi,<br>Lets create design<br>to make people <span class="c-mag">stop</span>,<br><span class="c-purp">think</span>, and <span class="c-mag">act</span>.</h1>
      <div class="hero-actions">

        <a href="#footer" class="btn btn-mag">HIT ME UP!</a>
      </div>
    </div>

    <!-- Pola Vertikal Geometris Kanan -->
    <div class="side-pattern">
      <span class="c-mag">LU</span><span class="c-purp">TH</span><span class="c-purp">LU</span><span class="c-mag">TH</span>
    </div>

</header>

<!-- OVERVIEW SECTION -->
<section id="overview" class="container">
  <h2 class="section-title">Overview</h2>
  <div id="galleryGrid" class="gallery-grid">
    <div style="font-weight:700;">Loading files...</div>
  </div>
</section>

<!-- FOOTER -->
<footer id="footer">
  <div class="container">
    <div class="footer-card">
      <div class="footer-motto">Create to discover, design to inspire.</div>
      <div class="social-row">
        <a href="https://www.linkedin.com/" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
        <a href="mailto:mail@gmail.com" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg></a>

      </div>
      <div class="footer-copy">© 2026 LUTHFI HIDAYAT.</div>

</footer>

<!-- LIGHTBOX MODAL (FIT TO RATIO) -->
<div id="modal">
  <div id="modal-content">
    <button onclick="closeModal()" class="modal-close">&times;</button>
    <button onclick="moveGallery(-1)" class="modal-nav nav-prev" id="btn-prev">&#8249;</button>
    <button onclick="moveGallery(1)" class="modal-nav nav-next" id="btn-next">&#8250;</button>
    
    <div id="modal-media-container"></div>
    
    <div class="modal-info-bar">
      <h3 id="modal-title" style="font-size: 20px; font-weight: 700; margin-bottom: 5px;">Title</h3>
      <p id="modal-desc" style="font-size: 14px; opacity: 0.8;">Description</p>
    </div>
  </div>
</div>

<script>
// ── KONFIGURASI DATABASE ──
const GITHUB_USER = 'luthfihd';   
const GITHUB_REPO = 'luthporto'; 
const DATA_URL    = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;
const IMAGES_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/images/`;

// Fungsi Proxy GDrive untuk performa cepat (Weserv CDN)
function getDriveUrl(url, size) {
  let fileId = null;
  if (url.includes('/file/d/')) fileId = url.split('/file/d/')[1]?.split('/')[0];
  else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
  if (fileId) {
    let gdrive = `https://drive.google.com/thumbnail?authuser=0&sz=w${size}&id=${fileId}`;
    return `https://images.weserv.nl/?url=${encodeURIComponent(gdrive)}&output=webp`;
  }
  return url;
}

// Fetch 1-10 Top Works
async function loadPortfolio() {
  try {
    const res = await fetch(DATA_URL);
    const items = await res.json();
    renderGallery(items.slice(0, 10)); // Batasi hanya 10 konten terbaik
  } catch(e) {
    document.getElementById('galleryGrid').innerHTML = '<p>Gagal memuat data portofolio.</p>';
  }
}

// Render Accordion Flex Gallery
function renderGallery(items) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  items.forEach(item => {
    const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
    const totalFiles = rawLinks.length;
    
    const card = document.createElement('div');
    card.className = 'project-card';

    // Jika gambar lebih dari 1, buat Accordion Kipas. Jika 1, buat Single Card.
    if (totalFiles > 1) {
      let slicesHtml = '';
      rawLinks.forEach((link, idx) => {
        let src = link.trim().replace('#video', '');
        src = src.startsWith('http') ? src : IMAGES_BASE + src;
        if (src.includes('drive.google.com')) src = getDriveUrl(src, 600);
        
        // Membuka lightbox pada index gambar yang spesifik
        slicesHtml += `<div class="acc-slice" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')}, ${idx})"><img src="${src}" loading="lazy" alt="Preview"></div>`;
      });
      
      card.innerHTML = `
        <div class="accordion-wrapper">${slicesHtml}</div>
        <div class="project-info">
          <h3>${item.title}</h3><span class="project-badge">${totalFiles} Items - ${item.category}</span>
        </div>`;
    } else {
      let src = rawLinks[0].trim().replace('#video', '');
      src = src.startsWith('http') ? src : IMAGES_BASE + src;
      if (src.includes('drive.google.com')) src = getDriveUrl(src, 600);
      
      card.innerHTML = `
        <div class="acc-single" onclick="openLightbox(${JSON.stringify(item).replace(/"/g, '&quot;')}, 0)">
          <img src="${src}" loading="lazy" alt="Preview">
        </div>
        <div class="project-info">
          <h3>${item.title}</h3><span class="project-badge">${item.category}</span>
        </div>`;
    }
    grid.appendChild(card);
  });
}

// ── LIGHTBOX (FIT-TO-RATIO) ──
function moveGallery(direction) {
  const container = document.getElementById('modal-media-container');
  const width = container.offsetWidth;
  container.scrollBy({ left: direction * width, behavior: 'smooth' });
}

function openLightbox(item, targetIndex) {
  const modal = document.getElementById('modal');
  const container = document.getElementById('modal-media-container');
  container.innerHTML = '';
  
  modal.style.display = 'flex';
  setTimeout(() => modal.style.opacity = '1', 10);

  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-desc').textContent = item.desc || item.category;

  const rawLinks = (item.image || item.src || "").split(',').filter(l => l.trim() !== "");
  
  rawLinks.forEach((link, idx) => {
    let src = link.trim().replace('#video', '');
    src = src.startsWith('http') ? src : IMAGES_BASE + src;
    if (src.includes('drive.google.com')) src = getDriveUrl(src, 1600);
    
    // Fit to ratio
    container.innerHTML += `<img id="img-slice-${idx}" src="${src}" alt="Art">`;
  });

  document.getElementById('btn-prev').style.display = rawLinks.length > 1 ? 'block' : 'none';
  document.getElementById('btn-next').style.display = rawLinks.length > 1 ? 'block' : 'none';
  document.body.style.overflow = 'hidden';

  // Otomatis scroll ke gambar yang diklik dari accordion
  setTimeout(() => {
      const targetImg = document.getElementById(`img-slice-${targetIndex}`);
      if(targetImg) {
          targetImg.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'center' });
      }
  }, 50);
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.style.opacity = '0';
  setTimeout(() => {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }, 300);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// Inisialisasi Navigasi Aktif Otomatis
window.addEventListener('scroll', () => {
    const sections = document.querySelectorAll('header, section, footer');
    const navLinks = document.querySelectorAll('.nav-pill a');
    let current = '';
    sections.forEach(sec => {
        if(window.scrollY >= (sec.offsetTop - 150)) current = sec.getAttribute('id');
    });
    navLinks.forEach(a => {
        a.classList.remove('active');
        if(a.getAttribute('href').includes(current)) a.classList.add('active');
    });
});

loadPortfolio();
</script>
</body>
</html>
